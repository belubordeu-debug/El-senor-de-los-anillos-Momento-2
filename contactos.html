<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contactos</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="contenedor-principal">
        <header class="sitio-encabezado">
            <div class="contenido-cabecera">
                <img src="Imagenes/logo.senor.anillos.png" alt="Logo de El Senor de los Anillos" class="logo-principal">
                <nav class="menu-navegacion">
                    <a href="index.html">Home</a>
                    <a href="la.comunidad.del.anillo.html">La comunidad del anillo</a>
                    <a href="las.dos.torres.html">Las dos torres</a>
                    <a href="el.retorno.del.rey.html">El retorno del rey</a>
                    <a href="galeria.html">Galeria</a>
                </nav>
            </div>
        </header>
        <section class="seccion-imagen-contacto">
            <img src="Imagenes/conversar.jpg" alt="Personajes hablando" class="imagen-principal-contacto">
        </section>
        <section class="seccion-titulo-conversacion">
            <h1 class="titulo-principal-fans">Conversa con otros fans</h1>
        </section>
        <section class="seccion-formulario-comentarios">
            <div class="caja-formulario">
                <h3 class="titulo-centrado">Deja tu contacto</h3>
                <form id="formContacto">
                    <div class="campo-form">
                        <label for="nombreUsuario">Nombre:</label>
                        <input type="text" id="nombreUsuario" placeholder="Ej: Aragorn" required>
                    </div>
                    <div class="campo-form">
                        <label for="apellidoUsuario">Apellido:</label>
                        <input type="text" id="apellidoUsuario" placeholder="Ej: Elessar" required>
                    </div>
                     <div class="campo-form">
                        <label for="mailUsuario">Mail:</label>
                        <input type="email" id="mailUsuario" placeholder="Ej: Aragorn@senordelosanillos.com" required>
                    </div>
                    <div class="campo-form">
                        <label for="edadUsuario">Edad:</label>
                        <input type="number" id="edadUsuario" placeholder="Ej: 87" required>
                    </div>
                    <button type="submit" class="boton-enviar-comentario">Guardar contacto</button>
                </form>
            </div>
        </section>
        <section class="seccion-formulario-comentarios">
            <div class="caja-formulario">
                <h3 class="titulo-centrado">Deja tu mensaje</h3>
                <form id="formComentario">
                    <div class="campo-form">
                        <label for="apodoUsuario">Apodo:</label>
                        <input type="text" id="apodoUsuario" placeholder="Ej: Trancos (Strider)">
                    </div>
                    <div class="campo-form">
                        <label for="textoComentario">Comentario:</label>
                        <textarea id="textoComentario" rows="4" placeholder="Escribe tu opinión sobre los personajes, tu escena favorita..." required></textarea>
                    </div>
                    <button type="submit" class="boton-enviar-comentario">Publicar comentario</button>
                </form>
            </div>
        </section>

        <section class="seccion-comentarios-recibidos">
            <h3 class="titulo-seccion-especies titulo-centrado">Comentarios de la Comunidad</h3>
            <div id="contenedorComentarios" class="lista-comentarios">
            </div>
        </section>
        
        <footer class="sitio-pie">
            <p>Copyright 2026 - Todos los derechos reservados - Belen Bordeu</p>
        </footer>
    </div>
    <script src="codigo.js"></script>
</body>
</html>
